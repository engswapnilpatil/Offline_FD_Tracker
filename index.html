/* ---------- money & date helpers ---------- */
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const inr=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',minimumFractionDigits:2,maximumFractionDigits:2}).format(r2(n));
// Maturity = P * (1 + R/4)^(4*Y), with R as a decimal (rate% / 100)
const maturity=(p,rate,y)=>r2(p*Math.pow(1+(rate/100)/4,4*y));
const DAY=864e5;
const todayUTC=()=>{const n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());};
const iso=ms=>new Date(ms).toISOString().slice(0,10);

const monthsOf=(v,u)=>Math.max(1,Math.round(u==='Years'?v*12:v));

};

const isNative=()=>{try{return !!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());}catch(e){return false;}};
const LN=()=>{try{return (Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications)||Capacitor.registerPlugin('LocalNotifications');}catch(e){return null;}};
async function notifPerm(ask){const p=LN();if(!p)return 'unsupported';try{let r=await p.checkPermissions();if(r.display!=='granted'&&ask)r=await p.requestPermissions();return r.display;}catch(e){return 'unsupported';}}

  const pend=await p.getPending();
  if(pend.notifications&&pend.notifications.length)await p.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
  const now=Date.now(),out=[];let id=1;
  items.filter(x=>x.daysLeft>=0&&!x.closed).forEach(x=>{
   [[7,'FD matures in 7 days'],[1,'FD matures tomorrow'],[0,'FD matures today']].forEach(([b,t])=>{
    const[y,m,dd]=x.end.split('-').map(Number);const at=new Date(y,m-1,dd-b,9,0,0);
    if(at.getTime()>now)out.push({id:id++,title:t,body:x.bank+': '+inr(x.maturity)+' on '+fmt(x.end),schedule:{at,allowWhileIdle:true}});
   });});
  if(out.length)await p.schedule({notifications:out});
 }catch(e){}
}
