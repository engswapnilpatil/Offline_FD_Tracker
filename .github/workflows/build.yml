name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files (offline copies of libraries)
        run: |
          mkdir -p www/lib
          cp index.html www/index.html
          curl -fL -o www/lib/react.js https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js
          curl -fL -o www/lib/react-dom.js https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js
          curl -fL -o www/lib/tailwind.js https://cdn.tailwindcss.com
          sed -i 's#https://cdn.tailwindcss.com#lib/tailwind.js#; s#https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js#lib/react.js#; s#https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js#lib/react-dom.js#' www/index.html
      - name: Add Excel library
        run: |
          set +e
          mkdir -p www/lib
          curl -fL -o www/lib/xlsx.full.min.js https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js || curl -fL -o www/lib/xlsx.full.min.js https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js
          ls -la www/lib/xlsx.full.min.js
          exit 0
      - run: npm install
      - name: Add offline OCR files
        run: |
          set +e
          npm install --no-save tesseract.js@5 @tesseract.js-data/eng
          mkdir -p www/lib/ocr/core www/lib/ocr/lang
          cp node_modules/tesseract.js/dist/tesseract.min.js www/lib/ocr/
          cp node_modules/tesseract.js/dist/worker.min.js www/lib/ocr/
          cp node_modules/tesseract.js-core/tesseract-core* www/lib/ocr/core/
          F=$(find node_modules/@tesseract.js-data/eng -name eng.traineddata.gz | sort | grep best_int | head -1)
          [ -z "$F" ] && F=$(find node_modules/@tesseract.js-data/eng -name eng.traineddata.gz | head -1)
          cp "$F" www/lib/ocr/lang/eng.traineddata.gz
          if ! gzip -t www/lib/ocr/lang/eng.traineddata.gz 2>/dev/null; then
            for U in https://tessdata.projectnaptha.com/4.0.0_best_int/eng.traineddata.gz https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int/eng.traineddata.gz https://tessdata.projectnaptha.com/4.0.0/eng.traineddata.gz; do
              curl -fL -o www/lib/ocr/lang/eng.traineddata.gz "$U" && gzip -t www/lib/ocr/lang/eng.traineddata.gz && break
            done
          fi
          ls -la www/lib/ocr www/lib/ocr/core www/lib/ocr/lang
          exit 0
      - run: npx cap add android && npx cap sync android
      - name: Add notification permissions
        run: sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Generate app icon
        run: |
          sudo apt-get install -y fonts-dejavu-core > /dev/null
          pip install pillow
          python make_icons.py
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: FD Tracker v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
