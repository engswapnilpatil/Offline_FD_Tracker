<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FD Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
</style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100">
<div id="root"></div>
<script>
const {useState,useEffect,useMemo}=React;
const h=React.createElement;
const d=(t,c,...k)=>h(t,{className:c},...k);
const KEY='fd_tracker_v1';
const P={
 shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',
 rupee:'M6 3h12M6 8h12M6 13l8.5 8M6 13h3a4 4 0 000-8',
 trend:'M22 7l-8.5 8.5-5-5L2 17M16 7h6v6',
 wallet:'M3 7h16a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2zM3 7l2-3h12M16 14h2',
 bell:'M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0',
 trash:'M3 6h18M8 6V4h8v2m-9 0l1 14h8l1-14',
 down:'M12 3v12m0 0l-4-4m4 4l4-4M4 21h16',
 up:'M12 15V3m0 0L8 7m4-4l4 4M4 21h16',
 plus:'M12 5v14M5 12h14',
 cal:'M3 8h18M5 4h14a2 2 0 012 2v14H3V6a2 2 0 012-2zM8 2v4m8-4v4',
 bank:'M3 21h18M5 21V10m4 11V10m6 11V10m4 11V10M2 10l10-6 10 6',
 copy:'M9 9h11v11H9zM5 15H4V4h11v1'
};
const Ic=({n,c})=>h('svg',{className:c||'w-5 h-5',viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},h('path',{d:P[n]}));

/* ---------- money & date helpers ---------- */
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const inr=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',minimumFractionDigits:2,maximumFractionDigits:2}).format(r2(n));
// Maturity = P * (1 + R/4)^(4*Y), with R as a decimal (rate% / 100)
const maturity=(p,rate,y)=>r2(p*Math.pow(1+(rate/100)/4,4*y));
const DAY=864e5;
const todayUTC=()=>{const n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());};
const iso=ms=>new Date(ms).toISOString().slice(0,10);
const addMonths=(s,mo)=>{const[y,m,dd]=s.split('-').map(Number);const last=new Date(Date.UTC(y,m+mo,0)).getUTCDate();return Date.UTC(y,m-1+mo,Math.min(dd,last));};
const fmt=s=>new Date(s+'T00:00:00Z').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'});
const monthsOf=(v,u)=>Math.max(1,Math.round(u==='Years'?v*12:v));
const enrich=f=>{
 const months=monthsOf(+f.tenureValue,f.tenureUnit),yrs=months/12;
 const endMs=addMonths(f.start,months),startMs=Date.parse(f.start),t=todayUTC();
 const mv=maturity(+f.principal,+f.rate,yrs);
 const el=Math.min(yrs,Math.max(0,(t-startMs)/(365.25*DAY)));
 return {...f,months,yrs,end:iso(endMs),daysLeft:Math.round((endMs-t)/DAY),maturity:mv,interest:r2(mv-f.principal),
  accrued:r2(f.principal*Math.pow(1+(f.rate/100)/4,4*el)-f.principal),
  pct:Math.min(100,Math.max(0,((t-startMs)/(endMs-startMs))*100))};
};
const valid=f=>f&&typeof f.bank==='string'&&f.bank.trim()&&+f.principal>0&&+f.rate>0&&/^\d{4}-\d{2}-\d{2}$/.test(f.start)&&+f.tenureValue>0&&['Years','Months'].includes(f.tenureUnit);

/* ---------- UI bits ---------- */
const inp='w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500';
const btn='inline-flex items-center justify-center gap-2 rounded-lg px-3 py-2 text-sm font-medium transition';
const Field=({label,children})=>d('label','block',d('span','block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1',label),children);
const Stat=({icon,label,value,sub,tone})=>d('div','rounded-2xl p-4 bg-white dark:bg-slate-800 shadow-sm border border-slate-200 dark:border-slate-700',
 d('div','flex items-center gap-2 text-sm text-slate-500 dark:text-slate-400',d('span','p-1.5 rounded-lg '+tone,h(Ic,{n:icon,c:'w-4 h-4'})),label),
 d('div','mt-2 text-xl sm:text-2xl font-bold tracking-tight break-words',value),
 sub&&d('div','text-xs text-slate-500 dark:text-slate-400 mt-1',sub));
const Mini=({l,v,b})=>d('div','',d('div','text-[11px] uppercase tracking-wide text-slate-500 dark:text-slate-400',l),d('div','text-sm '+(b?'font-bold':'font-semibold'),v));

function FDCard({fd,confirming,onDel}){
 const dl=fd.daysLeft,matured=dl<0,soon=dl>=0&&dl<=30,urgent=dl>=0&&dl<=7;
 const box=matured?'border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 opacity-80'
  :urgent?'border-red-400 bg-red-50 dark:bg-red-950/30 ring-1 ring-red-300'
  :soon?'border-amber-400 bg-amber-50 dark:bg-amber-950/30 ring-1 ring-amber-300'
  :'border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800';
 const badgeCls=matured?'bg-slate-200 text-slate-700 dark:bg-slate-700 dark:text-slate-200'
  :urgent?'bg-red-500 text-white':soon?'bg-amber-500 text-white':'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-200';
 const badge=matured?'Matured '+Math.abs(dl)+'d ago':dl===0?'Matures today':soon?'Matures in '+dl+'d':dl+' days left';
 return d('div','rounded-2xl border p-4 shadow-sm '+box,
  d('div','flex items-start justify-between gap-2',
   d('div','flex items-center gap-2 min-w-0',h(Ic,{n:'bank',c:'w-5 h-5 text-indigo-500 shrink-0'}),d('div','font-semibold truncate',fd.bank)),
   d('span','shrink-0 inline-flex items-center gap-1 text-xs font-semibold rounded-full px-2.5 py-1 '+badgeCls,(soon&&!matured)&&h(Ic,{n:'bell',c:'w-3.5 h-3.5'}),badge)),
  d('div','mt-3 grid grid-cols-2 gap-3',
   h(Mini,{l:'Principal',v:inr(fd.principal)}),
   h(Mini,{l:'Rate / Tenure',v:fd.rate+'% · '+fd.tenureValue+' '+fd.tenureUnit.toLowerCase()}),
   h(Mini,{l:'Interest',v:inr(fd.interest)}),
   h(Mini,{l:'Maturity value',v:inr(fd.maturity),b:1})),
  d('div','mt-3 flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400',h(Ic,{n:'cal',c:'w-4 h-4'}),fmt(fd.start)+'  →  '+fmt(fd.end)),
  d('div','mt-2 h-1.5 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden',h('div',{className:'h-full rounded-full '+(urgent?'bg-red-500':soon?'bg-amber-500':'bg-indigo-500'),style:{width:fd.pct+'%'}})),
  d('div','mt-3 flex justify-end',h('button',{className:btn+' '+(confirming?'bg-red-600 text-white':'text-slate-500 hover:text-red-600'),onClick:onDel},h(Ic,{n:'trash',c:'w-4 h-4'}),confirming?'Tap again to delete':'Delete')));
}

function App(){
 const blank={bank:'',principal:'',rate:'',start:iso(todayUTC()),tv:'',tu:'Years'};
 const [fds,setFds]=useState(()=>{try{const v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)?v.filter(valid):[];}catch(e){return [];}});
 const [f,setF]=useState(blank);
 const [err,setErr]=useState('');
 const [confirmId,setConfirmId]=useState(null);
 const [backup,setBackup]=useState('');
 const [paste,setPaste]=useState('');
 const [msg,setMsg]=useState('');
 useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(fds));}catch(e){}},[fds]);
 const set=(k,v)=>setF(o=>({...o,[k]:v}));

 const list=useMemo(()=>fds.map(enrich).sort((a,b)=>a.daysLeft-b.daysLeft),[fds]);
 const T=useMemo(()=>{
  const principal=r2(list.reduce((s,x)=>s+ +x.principal,0)),payout=r2(list.reduce((s,x)=>s+x.maturity,0));
  return {principal,payout,interest:r2(payout-principal),accrued:r2(list.reduce((s,x)=>s+x.accrued,0)),soon:list.filter(x=>x.daysLeft>=0&&x.daysLeft<=30)};
 },[list]);

 const preview=(+f.principal>0&&+f.rate>0&&+f.tv>0)?maturity(+f.principal,+f.rate,monthsOf(+f.tv,f.tu)/12):null;

 const add=e=>{
  e.preventDefault();
  const item={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),bank:f.bank.trim(),principal:+f.principal,rate:+f.rate,start:f.start,tenureValue:+f.tv,tenureUnit:f.tu};
  if(!valid(item)){setErr('Please fill every field with valid values (amount, rate and tenure must be above 0).');return;}
  setErr('');setFds(o=>[...o,item]);setF({...blank,start:f.start});
 };
 const del=id=>{if(confirmId===id){setFds(o=>o.filter(x=>x.id!==id));setConfirmId(null);}else{setConfirmId(id);setTimeout(()=>setConfirmId(c=>c===id?null:c),3000);}};

 const doExport=()=>{
  const json=JSON.stringify({app:'fd-tracker',version:1,exportedAt:new Date().toISOString(),fds},null,2);
  setBackup(json);setMsg('Backup ready. A download was attempted; if nothing saved, use Copy below and paste into a .json file.');
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download='fd-backup-'+iso(todayUTC())+'.json';document.body.appendChild(a);a.click();a.remove();}catch(e){}
 };
 const copy=async()=>{try{await navigator.clipboard.writeText(backup);setMsg('Copied to clipboard.');}catch(e){setMsg('Copy blocked: select the text above and copy it manually.');}};
 const doImport=text=>{
  try{
   const x=JSON.parse(text),arr=Array.isArray(x)?x:x.fds;
   if(!Array.isArray(arr))throw new Error('x');
   const good=arr.filter(valid).map(i=>({id:String(i.id||Date.now().toString(36)+Math.random().toString(36).slice(2,6)),bank:i.bank.trim(),principal:+i.principal,rate:+i.rate,start:i.start,tenureValue:+i.tenureValue,tenureUnit:i.tenureUnit}));
   const have=new Set(fds.map(i=>i.id)),fresh=good.filter(i=>!have.has(i.id));
   setFds(o=>[...o,...fresh]);
   setMsg('Imported '+fresh.length+' FD(s)'+(arr.length-good.length?'; skipped '+(arr.length-good.length)+' invalid':'')+(good.length-fresh.length?'; '+(good.length-fresh.length)+' already present':'')+'.');
   setPaste('');
  }catch(e){setMsg('Import failed: that is not a valid FD backup file.');}
 };
 const onFile=e=>{const file=e.target.files&&e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>doImport(String(r.result));r.onerror=()=>setMsg('Could not read that file.');r.readAsText(file);e.target.value='';};

 return d('div','max-w-5xl mx-auto px-4 py-6 space-y-5',
  d('header','flex items-center gap-3',
   d('div','p-2.5 rounded-xl bg-indigo-600 text-white',h(Ic,{n:'shield'})),
   d('div','',d('h1','text-xl sm:text-2xl font-bold','FD Tracker'),d('p','text-xs text-slate-500 dark:text-slate-400','Private by design · data never leaves this browser · no logins, no PAN'))),

  T.soon.length>0&&d('div','flex items-center gap-3 rounded-xl border border-amber-400 bg-amber-50 dark:bg-amber-950/30 p-3 text-sm',
   h(Ic,{n:'bell',c:'w-5 h-5 text-amber-600 shrink-0'}),
   d('div','',d('b','',T.soon.length+' FD'+(T.soon.length>1?'s':'')+' maturing within 30 days: '),T.soon.map(x=>x.bank+' ('+fmt(x.end)+')').join(', '))),

  d('div','grid grid-cols-1 sm:grid-cols-3 gap-3',
   h(Stat,{icon:'wallet',label:'Total Principal Invested',value:inr(T.principal),tone:'bg-indigo-100 text-indigo-700 dark:bg-indigo-900/50 dark:text-indigo-200',sub:list.length+' deposit'+(list.length===1?'':'s')}),
   h(Stat,{icon:'trend',label:'Cumulative Interest Earned',value:inr(T.interest),tone:'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-200',sub:'By maturity · '+inr(T.accrued)+' accrued so far'}),
   h(Stat,{icon:'rupee',label:'Total Expected Payout',value:inr(T.payout),tone:'bg-violet-100 text-violet-700 dark:bg-violet-900/50 dark:text-violet-200',sub:'Principal + interest'})),

  d('div','grid grid-cols-1 lg:grid-cols-3 gap-5 items-start',
   d('div','space-y-5',
    h('form',{onSubmit:add,className:'rounded-2xl p-4 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm space-y-3'},
     d('h2','font-semibold flex items-center gap-2',h(Ic,{n:'plus',c:'w-5 h-5 text-indigo-500'}),'Add Fixed Deposit'),
     h(Field,{label:'Bank name'},h('input',{className:inp,placeholder:'e.g. HDFC Bank',value:f.bank,onChange:e=>set('bank',e.target.value)})),
     h(Field,{label:'Principal amount (₹)'},h('input',{className:inp,type:'number',inputMode:'decimal',min:'0',step:'any',placeholder:'100000',value:f.principal,onChange:e=>set('principal',e.target.value)})),
     d('div','grid grid-cols-2 gap-3',
      h(Field,{label:'Annual rate (%)'},h('input',{className:inp,type:'number',inputMode:'decimal',min:'0',step:'any',placeholder:'7.25',value:f.rate,onChange:e=>set('rate',e.target.value)})),
      h(Field,{label:'Start date'},h('input',{className:inp,type:'date',value:f.start,onChange:e=>set('start',e.target.value)}))),
     h(Field,{label:'Tenure'},d('div','flex gap-2',
      h('input',{className:inp,type:'number',inputMode:'decimal',min:'0',step:'any',placeholder:'2',value:f.tv,onChange:e=>set('tv',e.target.value)}),
      h('select',{className:inp+' w-32',value:f.tu,onChange:e=>set('tu',e.target.value)},h('option',null,'Years'),h('option',null,'Months')))),
     preview!==null&&d('div','rounded-lg bg-indigo-50 dark:bg-indigo-950/40 text-indigo-800 dark:text-indigo-200 text-sm p-2.5','Maturity value: ',d('b','',inr(preview))),
     err&&d('div','text-sm text-red-600',err),
     h('button',{type:'submit',className:btn+' w-full bg-indigo-600 hover:bg-indigo-700 text-white'},h(Ic,{n:'plus',c:'w-4 h-4'}),'Add FD'),
     d('p','text-[11px] text-slate-500 dark:text-slate-400','Maturity = P × (1 + R/4)^(4 × Years), compounded quarterly.')),

    d('div','rounded-2xl p-4 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm space-y-3',
     d('h2','font-semibold','Local Backup'),
     d('div','grid grid-cols-2 gap-2',
      h('button',{className:btn+' bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900',onClick:doExport},h(Ic,{n:'down',c:'w-4 h-4'}),'Export JSON'),
      h('label',{className:btn+' cursor-pointer border border-slate-300 dark:border-slate-600'},h(Ic,{n:'up',c:'w-4 h-4'}),'Import JSON',h('input',{type:'file',accept:'.json,application/json',className:'hidden',onChange:onFile}))),
     backup&&d('div','space-y-2',
      h('textarea',{readOnly:true,rows:5,className:inp+' font-mono text-xs',value:backup,onFocus:e=>e.target.select()}),
      h('button',{className:btn+' w-full border border-slate-300 dark:border-slate-600',onClick:copy},h(Ic,{n:'copy',c:'w-4 h-4'}),'Copy backup')),
     d('details','text-sm',d('summary','cursor-pointer text-slate-500 dark:text-slate-400','Or paste backup JSON to import'),
      d('div','mt-2 space-y-2',
       h('textarea',{rows:4,className:inp+' font-mono text-xs',placeholder:'{ "fds": [ ... ] }',value:paste,onChange:e=>setPaste(e.target.value)}),
       h('button',{className:btn+' w-full border border-slate-300 dark:border-slate-600',onClick:()=>doImport(paste)},'Import pasted JSON'))),
     msg&&d('div','text-xs text-slate-600 dark:text-slate-300',msg))),

   d('div','lg:col-span-2 space-y-3',
    d('h2','font-semibold flex items-center gap-2',h(Ic,{n:'cal',c:'w-5 h-5 text-indigo-500'}),'Your Fixed Deposits'),
    list.length===0?d('div','rounded-2xl border border-dashed border-slate-300 dark:border-slate-600 p-10 text-center text-sm text-slate-500 dark:text-slate-400','No FDs yet. Add your first deposit using the form.')
    :d('div','grid grid-cols-1 md:grid-cols-2 gap-3',list.map(x=>h(FDCard,{key:x.id,fd:x,confirming:confirmId===x.id,onDel:()=>del(x.id)}))))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
